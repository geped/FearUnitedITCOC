<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>CoCBoard &middot; Reclutamento</title>
<style>
:root {
  --bg:       #0D0B08;
  --bg-1:     #110E09;
  --bg-2:     #1A150E;
  --bg-3:     #221A0F;
  --border:   #2A2010;
  --gold:     #C9A962;
  --text:     #EEEAE0;
  --text-2:   #C8BCA8;
  --text-3:   #7A6A50;
  --green:    #27AE60;
  --radius:   10px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); }
body {
  font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.65;
  padding-bottom: max(env(safe-area-inset-bottom), 32px);
}

/* Hero */
.hero {
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  padding: 16px 14px 13px;
  display: flex;
  align-items: center;
  gap: 11px;
}
.hero img { width: 38px; height: 38px; object-fit: contain; flex-shrink: 0; }
.hero-title { font-size: 18px; font-weight: 800; color: var(--gold); line-height: 1.2; }
.hero-sub   { font-size: 11px; color: var(--text-3); margin-top: 1px; letter-spacing: .03em; }

/* Status bar */
.status-bar {
  background: var(--bg-1);
  border-bottom: 1px solid var(--border);
  padding: 6px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-3);
  position: sticky;
  top: 0;
  z-index: 10;
}
.status-left { display: flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); transition: background .3s; }
.dot.live { background: var(--green); }
.refresh-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--gold);
  border-radius: 4px;
  padding: 3px 10px;
  font-size: 11px;
  cursor: pointer;
  font-family: inherit;
}
.refresh-btn:active { opacity: .6; }

/* Content */
.content { max-width: 600px; margin: 0 auto; padding: 14px 10px; }

/* Empty / error */
.state-msg { text-align: center; padding: 52px 16px; color: var(--text-3); }
.state-msg .icon { font-size: 38px; margin-bottom: 10px; }
.state-msg p { font-size: 14px; line-height: 1.6; }

/* Cards */
.cards { display: flex; flex-direction: column; gap: 16px; }

.card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

/* Foto */
.card-photo-wrap {
  background: var(--bg-3);
  min-height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card-photo {
  width: 100%;
  max-height: 340px;
  object-fit: contain;
  display: block;
  background: var(--bg-3);
}
.photo-loader {
  padding: 18px 0;
  font-size: 12px;
  color: var(--text-3);
  display: flex;
  align-items: center;
  gap: 7px;
}
.photo-loader::before {
  content: '';
  width: 14px; height: 14px;
  border: 2px solid var(--border);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Testo post */
.card-body {
  padding: 13px 13px 9px;
  font-size: 14px;
  line-height: 1.65;
  word-break: break-word;
  overflow-wrap: break-word;
}
.card-body b, .card-body strong { font-weight: 700; }
.card-body i, .card-body em { font-style: italic; }
.card-body u, .card-body ins { text-decoration: underline; }
.card-body s, .card-body strike, .card-body del { text-decoration: line-through; color: var(--text-3); }
.card-body code {
  font-family: 'Courier New', monospace;
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 5px;
  font-size: 12px;
}
.card-body pre {
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 10px;
  overflow-x: auto;
  font-size: 12px;
  font-family: 'Courier New', monospace;
  margin: 6px 0;
  white-space: pre-wrap;
}
.card-body a { color: var(--gold); text-decoration: none; word-break: break-all; }
.card-body a:hover { text-decoration: underline; }
tg-spoiler {
  background: var(--text-3);
  color: transparent;
  border-radius: 3px;
  cursor: pointer;
  user-select: none;
  padding: 0 3px;
  transition: all .2s;
}
tg-spoiler.on { background: transparent; color: inherit; }

/* Footer */
.card-footer {
  padding: 7px 13px;
  border-top: 1px solid var(--border);
  background: var(--bg-1);
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  font-size: 11px;
  color: var(--text-3);
}
.badge {
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px 8px;
  white-space: nowrap;
}
.badge.exp { color: var(--gold); border-color: rgba(201,169,98,.3); }
.badge.dt  { margin-left: auto; }

/* Countdown */
.refresh-hint { text-align: center; padding: 12px 0 0; font-size: 11px; color: var(--text-3); }
</style>
</head>
<body>

<div class="hero">
  <img src="assets/cocboardbot-no-bg.png" alt="CoCBoard">
  <div>
    <div class="hero-title">Reclutamento</div>
    <div class="hero-sub">Annunci attivi &middot; CoCBoard Community</div>
  </div>
</div>

<div class="status-bar">
  <div class="status-left">
    <span class="dot" id="dot"></span>
    <span id="statusText">Caricamento&hellip;</span>
  </div>
  <button class="refresh-btn" onclick="load(true)">&#8635; Aggiorna</button>
</div>

<div class="content" id="content">
  <div class="state-msg"><div class="icon">&#9203;</div><p>Caricamento annunci&hellip;</p></div>
</div>

<script>
// Spoiler
document.addEventListener('click', function(e) {
  if (e.target.tagName === 'TG-SPOILER') e.target.classList.toggle('on');
});

function remaining(iso) {
  var ms = new Date(iso).getTime() - Date.now();
  if (ms <= 0) return 'scaduto';
  var h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000);
  return h > 0 ? h + 'h ' + m + 'm' : m + 'm';
}

function fmtDate(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  return d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' }) +
    ' ' + d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
}

function escapeAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
}

function sanitize(html) {
  var tmp = document.createElement('div');
  tmp.innerHTML = html;
  var OK = new Set(['B','STRONG','I','EM','U','INS','S','STRIKE','DEL',
    'CODE','PRE','A','TG-SPOILER','TG-EMOJI','BR','SPAN']);
  function walk(n) {
    var ch = Array.from(n.childNodes);
    for (var i = 0; i < ch.length; i++) {
      var c = ch[i];
      if (c.nodeType === 3) continue;
      if (c.nodeType !== 1) { c.parentNode && c.parentNode.removeChild(c); continue; }
      if (!OK.has(c.tagName)) {
        while (c.firstChild) c.parentNode.insertBefore(c.firstChild, c);
        c.parentNode.removeChild(c);
        continue;
      }
      Array.from(c.attributes).forEach(function(a) {
        if (c.tagName === 'A' && a.name === 'href') return;
        c.removeAttribute(a.name);
      });
      if (c.tagName === 'A') {
        c.setAttribute('target', '_blank');
        c.setAttribute('rel', 'noopener noreferrer');
        var h = c.getAttribute('href') || '';
        if (/^javascript:/i.test(h.trim())) c.removeAttribute('href');
      }
      walk(c);
    }
  }
  walk(tmp);
  return tmp.innerHTML;
}

function renderCards(posts) {
  if (!posts.length) {
    return '<div class="state-msg"><div class="icon">&#128235;</div>' +
      '<p>Nessun annuncio attivo al momento.<br>Torna pi&ugrave; tardi o pubblica il tuo!</p></div>';
  }
  var html = '<div class="cards">';
  for (var i = 0; i < posts.length; i++) {
    var p = posts[i];
    html += '<div class="card">';
    // Foto
    if (p.photo_url) {
      html += '<div class="card-photo-wrap" id="pw' + i + '">' +
        '<div class="photo-loader" id="pl' + i + '">Foto in caricamento</div>' +
        '<img class="card-photo" src="' + escapeAttr(p.photo_url) + '" alt="Foto annuncio" loading="lazy" referrerpolicy="no-referrer"' +
        ' onload="showPhoto(' + i + ')" onerror="hidePhoto(' + i + ')" style="display:none"></div>';
    }
    // Testo
    var txt = sanitize(p.post_text);
    if (txt) html += '<div class="card-body">' + txt + '</div>';
    // Footer
    html += '<div class="card-footer">' +
      '<span class="badge exp">&#9203; Scade tra ' + remaining(p.expires_at) + '</span>' +
      (fmtDate(p.approved_at) ? '<span class="badge dt">' + fmtDate(p.approved_at) + '</span>' : '') +
      '</div></div>';
  }
  html += '<div class="refresh-hint" id="hint"></div></div>';
  return html;
}

function showPhoto(i) {
  var pw = document.getElementById('pw' + i);
  var pl = document.getElementById('pl' + i);
  if (pw) { var img = pw.querySelector('img'); if (img) img.style.display = 'block'; }
  if (pl) pl.style.display = 'none';
}
function hidePhoto(i) {
  var pw = document.getElementById('pw' + i);
  if (pw) pw.style.display = 'none';
}

var timer = null, nextAt = null;
function schedule() {
  clearInterval(timer);
  nextAt = Date.now() + 60000;
  timer = setInterval(function() {
    var left = Math.max(0, Math.ceil((nextAt - Date.now()) / 1000));
    var hint = document.getElementById('hint');
    if (hint) hint.textContent = left > 0 ? 'Aggiornamento automatico tra ' + left + 's' : '';
    if (left === 0) load(false);
  }, 1000);
}

async function load(manual) {
  var dot = document.getElementById('dot');
  var st  = document.getElementById('statusText');
  var ct  = document.getElementById('content');
  if (manual) { dot.className = 'dot'; st.textContent = 'Aggiornamento\u2026'; }
  try {
    var res = await fetch('/api/lookup?type=recruit-list', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var json = await res.json();
    var posts = json.posts || [];
    var n = posts.length;
    dot.className = 'dot live';
    st.textContent = n ? n + (n === 1 ? ' annuncio attivo' : ' annunci attivi') : 'Nessun annuncio attivo';
    ct.innerHTML = renderCards(posts);
    schedule();
  } catch (err) {
    dot.className = 'dot';
    st.textContent = 'Errore di rete';
    ct.innerHTML = '<div class="state-msg"><div class="icon">&#9888;&#65039;</div>' +
      '<p>Impossibile caricare gli annunci.<br><small>' + err.message + '</small></p></div>';
  }
}

load(true);
</script>
</body>
</html>
