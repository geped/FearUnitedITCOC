<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>CoCBoard · Reclutamento</title>
<style>
:root {
  --bg:       #0D0B08;
  --bg-1:     #110E09;
  --bg-2:     #1A150E;
  --bg-3:     #221A0F;
  --border:   #2A2010;
  --gold:     #C9A962;
  --gold-dim: rgba(201,169,98,0.13);
  --text:     #EEEAE0;
  --text-2:   #C8BCA8;
  --text-3:   #7A6A50;
  --green:    #27AE60;
  --radius:   10px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); }
body {
  font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.65;
  padding-bottom: max(env(safe-area-inset-bottom), 32px);
}

/* ── Hero ── */
.hero {
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  padding: 18px 16px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.hero-logo {
  width: 40px; height: 40px;
  object-fit: contain;
  flex-shrink: 0;
}
.hero-title {
  font-size: 19px;
  font-weight: 800;
  color: var(--gold);
  letter-spacing: .01em;
  line-height: 1.2;
}
.hero-sub {
  font-size: 11px;
  color: var(--text-3);
  margin-top: 2px;
  letter-spacing: .03em;
}

/* ── Status bar ── */
.status-bar {
  background: var(--bg-1);
  border-bottom: 1px solid var(--border);
  padding: 7px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-3);
  letter-spacing: .03em;
  position: sticky;
  top: 0;
  z-index: 10;
}
.status-left { display: flex; align-items: center; gap: 6px; }
.status-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--text-3);
  flex-shrink: 0;
  transition: background .3s;
}
.status-dot.live { background: var(--green); }
.refresh-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--gold);
  border-radius: 4px;
  padding: 3px 10px;
  font-size: 11px;
  cursor: pointer;
  font-family: inherit;
  letter-spacing: .03em;
  transition: opacity .15s;
}
.refresh-btn:active { opacity: .6; }

/* ── Content ── */
.content {
  max-width: 600px;
  margin: 0 auto;
  padding: 14px 10px;
}

/* ── States ── */
.state-msg {
  text-align: center;
  padding: 52px 16px;
  color: var(--text-3);
}
.state-msg .icon { font-size: 38px; margin-bottom: 12px; }
.state-msg p { font-size: 14px; line-height: 1.6; }

/* ── Cards ── */
.cards { display: flex; flex-direction: column; gap: 16px; }

.card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

/* Foto in cima alla card */
.card-photo-wrap {
  width: 100%;
  background: var(--bg-3);
  position: relative;
  min-height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card-photo {
  width: 100%;
  max-height: 340px;
  object-fit: contain;
  display: block;
  background: var(--bg-3);
}
.card-photo-loading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-3);
  font-size: 13px;
  gap: 6px;
}
.card-photo-loading::before {
  content: '';
  width: 16px; height: 16px;
  border: 2px solid var(--border);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Testo post */
.card-body {
  padding: 14px 14px 10px;
  font-size: 14px;
  line-height: 1.65;
  color: var(--text);
  word-break: break-word;
  overflow-wrap: break-word;
}

/* Telegram HTML subset */
.card-body b, .card-body strong { font-weight: 700; }
.card-body i, .card-body em { font-style: italic; }
.card-body u, .card-body ins { text-decoration: underline; }
.card-body s, .card-body strike, .card-body del { text-decoration: line-through; color: var(--text-3); }
.card-body code {
  font-family: 'Courier New', monospace;
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 5px;
  font-size: 12px;
}
.card-body pre {
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 10px;
  overflow-x: auto;
  font-size: 12px;
  font-family: 'Courier New', monospace;
  margin: 8px 0;
  white-space: pre-wrap;
}
.card-body a {
  color: var(--gold);
  text-decoration: none;
  word-break: break-all;
}
.card-body a:hover { text-decoration: underline; }
tg-spoiler {
  background: var(--text-3);
  color: transparent;
  border-radius: 3px;
  cursor: pointer;
  user-select: none;
  padding: 0 3px;
  transition: all .2s;
}
tg-spoiler.revealed { background: transparent; color: inherit; }

/* Footer card */
.card-footer {
  padding: 8px 14px;
  border-top: 1px solid var(--border);
  background: var(--bg-1);
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  font-size: 11px;
  color: var(--text-3);
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px 8px;
  white-space: nowrap;
}
.badge.expires { color: var(--gold); border-color: rgba(201,169,98,.3); }
.badge.date    { color: var(--text-3); margin-left: auto; }

/* Countdown hint */
.refresh-hint {
  text-align: center;
  padding: 12px 0 0;
  font-size: 11px;
  color: var(--text-3);
}
</style>
</head>
<body>

<div class="hero">
  <img class="hero-logo" src="assets/cocboardbot-no-bg.png" alt="CoCBoard">
  <div>
    <div class="hero-title">Reclutamento</div>
    <div class="hero-sub">Annunci attivi &middot; CoCBoard Community</div>
  </div>
</div>

<div class="status-bar">
  <div class="status-left">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Caricamento&hellip;</span>
  </div>
  <button class="refresh-btn" onclick="loadPosts(true)">&circlearrowleft; Aggiorna</button>
</div>

<div class="content" id="content">
  <div class="state-msg">
    <div class="icon">&#9203;</div>
    <p>Caricamento annunci&hellip;</p>
  </div>
</div>

<script>
/* ── Spoiler click ── */
document.addEventListener('click', function(e) {
  if (e.target.tagName === 'TG-SPOILER') e.target.classList.toggle('revealed');
});

/* ── Formattazioni ── */
function formatRemaining(expiresAt) {
  var ms = new Date(expiresAt).getTime() - Date.now();
  if (ms <= 0) return 'scaduto';
  var h = Math.floor(ms / 3600000);
  var m = Math.floor((ms % 3600000) / 60000);
  if (h > 0) return h + 'h ' + m + 'm';
  return m + 'm';
}

function formatDate(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  return d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' }) +
    ' ' + d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
}

/* ── Sanitizzazione HTML Telegram ── */
function sanitize(html) {
  var tmp = document.createElement('div');
  tmp.innerHTML = html;
  var ALLOWED = new Set(['B','STRONG','I','EM','U','INS','S','STRIKE','DEL',
    'CODE','PRE','A','TG-SPOILER','TG-EMOJI','BR','SPAN']);
  function walk(node) {
    var children = Array.from(node.childNodes);
    for (var i = 0; i < children.length; i++) {
      var n = children[i];
      if (n.nodeType === 3) continue; // testo
      if (n.nodeType !== 1) { n.parentNode && n.parentNode.removeChild(n); continue; }
      if (!ALLOWED.has(n.tagName)) {
        while (n.firstChild) n.parentNode.insertBefore(n.firstChild, n);
        n.parentNode.removeChild(n);
        continue;
      }
      var attrs = Array.from(n.attributes);
      for (var j = 0; j < attrs.length; j++) {
        var a = attrs[j];
        if (n.tagName === 'A' && a.name === 'href') continue;
        n.removeAttribute(a.name);
      }
      if (n.tagName === 'A') {
        n.setAttribute('target', '_blank');
        n.setAttribute('rel', 'noopener noreferrer');
        var href = n.getAttribute('href') || '';
        if (/^javascript:/i.test(href.trim())) n.removeAttribute('href');
      }
      walk(n);
    }
  }
  walk(tmp);
  return tmp.innerHTML;
}

/* ── Render cards ── */
function renderCards(posts) {
  if (!posts.length) {
    return '<div class="state-msg">' +
      '<div class="icon">&#128235;</div>' +
      '<p>Nessun annuncio attivo al momento.<br>Torna pi&ugrave; tardi o pubblica il tuo!</p>' +
      '</div>';
  }
  var html = '<div class="cards">';
  for (var i = 0; i < posts.length; i++) {
    var p = posts[i];
    var remaining = formatRemaining(p.expires_at);
    var dateStr = formatDate(p.approved_at);
    var safeText = sanitize(p.post_text);
    html += '<div class="card">';
    // Foto (se presente)
    if (p.photo_file_id) {
      var photoSrc = '/api/lookup?type=tg-photo&file_id=' + encodeURIComponent(p.photo_file_id);
      html += '<div class="card-photo-wrap" id="pw' + p.id + '">' +
        '<div class="card-photo-loading" id="pl' + p.id + '">Foto in caricamento</div>' +
        '<img class="card-photo" src="' + photoSrc + '"' +
        ' alt="Foto annuncio"' +
        ' loading="lazy"' +
        ' onload="onPhotoLoad(' + p.id + ')"' +
        ' onerror="onPhotoError(' + p.id + ')"' +
        ' style="display:none">' +
        '</div>';
    }
    // Testo
    if (safeText) {
      html += '<div class="card-body">' + safeText + '</div>';
    }
    // Footer
    html += '<div class="card-footer">' +
      '<span class="badge expires">&#9203; Scade tra ' + remaining + '</span>' +
      (dateStr ? '<span class="badge date">' + dateStr + '</span>' : '') +
      '</div>';
    html += '</div>';
  }
  html += '<div class="refresh-hint" id="refreshHint"></div></div>';
  return html;
}

function onPhotoLoad(id) {
  var wrap = document.getElementById('pw' + id);
  var loader = document.getElementById('pl' + id);
  if (wrap) {
    var img = wrap.querySelector('img');
    if (img) img.style.display = 'block';
  }
  if (loader) loader.style.display = 'none';
}

function onPhotoError(id) {
  var wrap = document.getElementById('pw' + id);
  if (wrap) wrap.style.display = 'none';
}

/* ── Auto-refresh ── */
var refreshTimer = null;
var nextRefreshAt = null;

function scheduleRefresh() {
  clearInterval(refreshTimer);
  nextRefreshAt = Date.now() + 60000;
  refreshTimer = setInterval(function() {
    var left = Math.max(0, Math.ceil((nextRefreshAt - Date.now()) / 1000));
    var hint = document.getElementById('refreshHint');
    if (hint) hint.textContent = left > 0 ? 'Aggiornamento automatico tra ' + left + 's' : '';
    if (left === 0) loadPosts(false);
  }, 1000);
}

/* ── Fetch principale ── */
async function loadPosts(manual) {
  var dot = document.getElementById('statusDot');
  var statusText = document.getElementById('statusText');
  var content = document.getElementById('content');
  if (manual) { dot.className = 'status-dot'; statusText.textContent = 'Aggiornamento\u2026'; }
  try {
    var res = await fetch('/api/lookup?type=recruit-list', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var json = await res.json();
    var posts = json.posts || [];
    var count = posts.length;
    dot.className = 'status-dot live';
    statusText.textContent = count
      ? count + (count === 1 ? ' annuncio attivo' : ' annunci attivi')
      : 'Nessun annuncio attivo';
    content.innerHTML = renderCards(posts);
    scheduleRefresh();
  } catch (err) {
    dot.className = 'status-dot';
    statusText.textContent = 'Errore di rete';
    content.innerHTML = '<div class="state-msg"><div class="icon">&#9888;&#65039;</div>' +
      '<p>Impossibile caricare gli annunci.<br><small>' + err.message + '</small></p></div>';
  }
}

loadPosts(true);
</script>
</body>
</html>
