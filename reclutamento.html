<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>CoCBoard &middot; Reclutamento</title>
<style>
:root {
  --bg:       #0D0B08;
  --bg-1:     #110E09;
  --bg-2:     #1A150E;
  --bg-3:     #221A0F;
  --border:   #2A2010;
  --gold:     #C9A962;
  --text:     #EEEAE0;
  --text-2:   #C8BCA8;
  --text-3:   #7A6A50;
  --green:    #27AE60;
  --red:      #C0392B;
  --radius:   10px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); }
body {
  font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.65;
  padding-bottom: max(env(safe-area-inset-bottom), 32px);
}

/* Hero */
.hero {
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  padding: 16px 14px 13px;
  display: flex;
  align-items: center;
  gap: 11px;
}
.hero img { width: 38px; height: 38px; object-fit: contain; flex-shrink: 0; }
.hero-title { font-size: 18px; font-weight: 800; color: var(--gold); line-height: 1.2; }
.hero-sub   { font-size: 11px; color: var(--text-3); margin-top: 1px; letter-spacing: .03em; }

/* Status bar */
.status-bar {
  background: var(--bg-1);
  border-bottom: 1px solid var(--border);
  padding: 6px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-3);
  position: sticky;
  top: 0;
  z-index: 10;
}
.status-left { display: flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); transition: background .3s; }
.dot.live { background: var(--green); }
.refresh-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--gold);
  border-radius: 4px;
  padding: 3px 10px;
  font-size: 11px;
  cursor: pointer;
  font-family: inherit;
}
.refresh-btn:active { opacity: .6; }

/* Content */
.content { max-width: 600px; margin: 0 auto; padding: 14px 10px; }

/* Empty / error */
.state-msg { text-align: center; padding: 52px 16px; color: var(--text-3); }
.state-msg .icon { font-size: 38px; margin-bottom: 10px; }
.state-msg p { font-size: 14px; line-height: 1.6; }

/* Cards */
.cards { display: flex; flex-direction: column; gap: 14px; }

.card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

/* Foto compatta */
.card-photo-wrap {
  background: var(--bg-3);
  height: 160px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.card-photo {
  width: 100%;
  height: 160px;
  object-fit: cover;
  display: block;
}
.photo-loader {
  padding: 14px 12px;
  font-size: 12px;
  color: var(--text-3);
  display: flex;
  align-items: center;
  gap: 7px;
  text-align: center;
}
.photo-loader::before {
  content: '';
  width: 13px; height: 13px;
  border: 2px solid var(--border);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }
.photo-loader.photo-error { flex-direction: column; color: #E07070; gap: 4px; }
.photo-loader.photo-error::before { display: none; }
.photo-loader.photo-error small { font-size: 10px; color: var(--text-3); word-break: break-all; line-height: 1.4; }

/* Testo post */
.card-body {
  padding: 10px 12px 0;
}

/* Wrapper testo troncabile */
.card-text-wrap {
  font-size: 12px;
  line-height: 1.65;
  word-break: break-word;
  overflow-wrap: break-word;
  max-height: calc(12px * 1.65 * 6 + 4px);
  overflow: hidden;
  transition: max-height 0.35s ease;
}
.card-text-wrap.expanded {
  max-height: 4000px;
}
.card-text-wrap b, .card-text-wrap strong { font-weight: 700; }
.card-text-wrap i, .card-text-wrap em { font-style: italic; }
.card-text-wrap u, .card-text-wrap ins { text-decoration: underline; }
.card-text-wrap s, .card-text-wrap strike, .card-text-wrap del { text-decoration: line-through; color: var(--text-3); }
.card-text-wrap code {
  font-family: 'Courier New', monospace;
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 5px;
  font-size: 11px;
}
.card-text-wrap pre {
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 8px;
  overflow-x: auto;
  font-size: 11px;
  font-family: 'Courier New', monospace;
  margin: 4px 0;
  white-space: pre-wrap;
}
.card-text-wrap a { color: var(--gold); text-decoration: none; word-break: break-all; }
.card-text-wrap a:hover { text-decoration: underline; }
tg-spoiler {
  background: var(--text-3);
  color: transparent;
  border-radius: 3px;
  cursor: pointer;
  user-select: none;
  padding: 0 3px;
  transition: all .2s;
}
tg-spoiler.on { background: transparent; color: inherit; }

/* Pulsante espandi */
.expand-btn {
  margin-top: 4px;
  padding: 2px 0 6px;
  font-size: 11px;
  color: var(--gold);
  cursor: pointer;
  background: none;
  border: none;
  font-family: inherit;
  display: block;
  width: 100%;
  text-align: left;
}
.expand-btn:active { opacity: .6; }

/* Meta clan (riga info sotto il testo) */
.card-meta {
  padding: 6px 12px 4px;
  font-size: 11px;
  color: var(--text-3);
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px;
}
.meta-clan { color: var(--gold); font-weight: 600; }
.meta-user { color: var(--text-3); }

/* Footer: scadenza + rimuovi */
.card-footer {
  padding: 6px 12px;
  border-top: 1px solid var(--border);
  background: var(--bg-1);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  font-size: 11px;
  color: var(--text-3);
}
.badge {
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px 8px;
  white-space: nowrap;
}
.badge.exp { color: var(--gold); border-color: rgba(201,169,98,.3); }
.remove-btn {
  background: none;
  border: 1px solid rgba(192,57,43,.4);
  border-radius: 4px;
  color: #E07070;
  font-size: 11px;
  padding: 2px 8px;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
  flex-shrink: 0;
}
.remove-btn:active { opacity: .6; }
.remove-btn.removing { opacity: .5; pointer-events: none; }

/* Link clan (riga separata in fondo) */
.card-link {
  padding: 6px 12px 8px;
  font-size: 11px;
  border-top: 1px solid var(--border);
}
.card-link a {
  color: var(--gold);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.card-link a:hover { text-decoration: underline; }

/* Countdown */
.refresh-hint { text-align: center; padding: 12px 0 0; font-size: 11px; color: var(--text-3); }
</style>
</head>
<body>

<div class="hero">
  <img src="assets/cocboardbot-no-bg.png" alt="CoCBoard">
  <div>
    <div class="hero-title">Reclutamento</div>
    <div class="hero-sub">Annunci attivi &middot; CoCBoard Community</div>
  </div>
</div>

<div class="status-bar">
  <div class="status-left">
    <span class="dot" id="dot"></span>
    <span id="statusText">Caricamento&hellip;</span>
  </div>
  <button class="refresh-btn" onclick="load(true)">&#8635; Aggiorna</button>
</div>

<div class="content" id="content">
  <div class="state-msg"><div class="icon">&#9203;</div><p>Caricamento annunci&hellip;</p></div>
</div>

<script>
// Spoiler
document.addEventListener('click', function(e) {
  if (e.target.tagName === 'TG-SPOILER') e.target.classList.toggle('on');
});

// Dati globali (bot_username, owner_ids per rimozione)
var _recruitMeta = { bot_username: null, owner_ids: [], tg_user_id: null };

// Rileva se siamo in Telegram Mini App
var _tgApp = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData
  ? window.Telegram.WebApp : null;
if (_tgApp) {
  try {
    var _u = _tgApp.initDataUnsafe && _tgApp.initDataUnsafe.user;
    if (_u && _u.id) _recruitMeta.tg_user_id = Number(_u.id);
  } catch (_) {}
}

function remaining(iso) {
  var ms = new Date(iso).getTime() - Date.now();
  if (ms <= 0) return 'scaduto';
  var h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000);
  return h > 0 ? h + 'h ' + m + 'm' : m + 'm';
}

function fmtDate(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  return d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' }) +
    ' ' + d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
}

function escapeAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
}
function escapeHtml(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function sanitize(html) {
  var tmp = document.createElement('div');
  tmp.innerHTML = html;
  var OK = new Set(['B','STRONG','I','EM','U','INS','S','STRIKE','DEL',
    'CODE','PRE','A','TG-SPOILER','TG-EMOJI','BR','SPAN']);
  function walk(n) {
    var ch = Array.from(n.childNodes);
    for (var i = 0; i < ch.length; i++) {
      var c = ch[i];
      if (c.nodeType === 3) continue;
      if (c.nodeType !== 1) { c.parentNode && c.parentNode.removeChild(c); continue; }
      if (!OK.has(c.tagName)) {
        while (c.firstChild) c.parentNode.insertBefore(c.firstChild, c);
        c.parentNode.removeChild(c);
        continue;
      }
      Array.from(c.attributes).forEach(function(a) {
        if (c.tagName === 'A' && a.name === 'href') return;
        c.removeAttribute(a.name);
      });
      if (c.tagName === 'A') {
        c.setAttribute('target', '_blank');
        c.setAttribute('rel', 'noopener noreferrer');
        var h = c.getAttribute('href') || '';
        if (/^javascript:/i.test(h.trim())) c.removeAttribute('href');
      }
      walk(c);
    }
  }
  walk(tmp);
  return tmp.innerHTML;
}

// Formatta submitter_display "Geped3 (#GPL82GJCQ)" → "Geped3 • #GPL82GJCQ"
function formatSubmitter(display) {
  if (!display) return '';
  var m = display.match(/^(.+?)\s*\(#([0-9A-Z]+)\)\s*$/i);
  if (m) return escapeHtml(m[1].trim()) + ' &bull; #' + escapeHtml(m[2].toUpperCase());
  return escapeHtml(display);
}

function renderCards(posts) {
  if (!posts.length) {
    return '<div class="state-msg"><div class="icon">&#128235;</div>' +
      '<p>Nessun annuncio attivo al momento.<br>Torna pi&ugrave; tardi o pubblica il tuo!</p></div>';
  }
  var html = '<div class="cards">';
  for (var i = 0; i < posts.length; i++) {
    var p = posts[i];
    html += '<div class="card" id="card' + i + '">';

    // Foto compatta
    if (p.photo_url) {
      var isProxy = p.photo_url.indexOf('/api/lookup?type=rphoto') === 0;
      html += '<div class="card-photo-wrap" id="pw' + i + '">' +
        '<div class="photo-loader" id="pl' + i + '">Foto in caricamento&hellip;</div>' +
        '<img class="card-photo" src="' + escapeAttr(p.photo_url) + '" alt="Foto annuncio"' +
        ' data-idx="' + i + '" data-pid="' + escapeAttr(String(p.id)) + '" data-proxy="' + (isProxy ? '1' : '0') + '"' +
        ' onload="showPhoto(' + i + ')" onerror="onPhotoError(' + i + ', this)" style="display:none"></div>';
    }

    // Corpo testo (solo body pulito, senza header/link)
    var bodyHtml = sanitize(p.body_html || '');
    if (bodyHtml) {
      html += '<div class="card-body">' +
        '<div class="card-text-wrap" id="ctw' + i + '">' + bodyHtml + '</div>' +
        '<button class="expand-btn" id="eb' + i + '" onclick="expandText(' + i + ')" style="display:none">' +
        '&#9660; Visualizza tutto</button>' +
        '</div>';
    }

    // Meta clan: ✅ Clan CoCBoard · 👤 Nome • #TAG
    var metaHtml = '';
    if (p.is_verified_clan) metaHtml += '<span class="meta-clan">&#9989; Clan CoCBoard</span>';
    if (p.submitter_display) {
      if (metaHtml) metaHtml += '<span class="meta-user">&nbsp;&middot;&nbsp;</span>';
      metaHtml += '<span class="meta-user">&#128100; ' + formatSubmitter(p.submitter_display) + '</span>';
    }
    if (metaHtml) html += '<div class="card-meta">' + metaHtml + '</div>';

    // Footer: scadenza + rimuovi
    html += '<div class="card-footer">' +
      '<span class="badge exp">&#9203; Scade tra ' + remaining(p.expires_at) + '</span>' +
      '<button class="remove-btn" id="rb' + i + '" onclick="removePost(' + i + ', ' + p.id + ', ' +
        (p.submitter_tg_id || 'null') + ')">&#128465; Rimuovi</button>' +
      '</div>';

    // Link clan (sempre in fondo, solo se presente)
    if (p.clan_url) {
      html += '<div class="card-link">' +
        '<a href="' + escapeAttr(p.clan_url) + '" target="_blank" rel="noopener noreferrer">' +
        '&#128279; Apri profilo clan (CoC)</a></div>';
    }

    html += '</div>';
  }
  html += '<div class="refresh-hint" id="hint"></div></div>';
  return html;
}

// --- Foto handlers ---
function showPhoto(i) {
  var pw = document.getElementById('pw' + i);
  var pl = document.getElementById('pl' + i);
  if (pw) { var img = pw.querySelector('img'); if (img) img.style.display = 'block'; }
  if (pl) pl.style.display = 'none';
}
function showPhotoError(i, statusCode, reason) {
  var pl = document.getElementById('pl' + i);
  if (!pl) return;
  pl.classList.add('photo-error');
  var status = statusCode ? 'HTTP ' + statusCode : 'Timeout / nessuna risposta';
  var detail = reason ? reason.slice(0, 120) : '';
  pl.innerHTML = '&#9888; Foto non disponibile<br><small>' + status + (detail ? ' &mdash; ' + detail : '') + '</small>';
}
async function diagnoseFetch(i, pid) {
  var url = '/api/lookup?type=rphoto&pid=' + encodeURIComponent(String(pid));
  try {
    var controller = new AbortController();
    var tid = setTimeout(function() { controller.abort(); }, 15000);
    var r = await fetch(url, { cache: 'no-store', signal: controller.signal });
    clearTimeout(tid);
    var reason = '';
    try {
      var ct = r.headers.get('content-type') || '';
      if (ct.indexOf('json') >= 0) { var j = await r.json(); reason = j.error || j.message || ''; }
      else { var txt = await r.text(); reason = txt.trim().slice(0, 120); }
    } catch (_) {}
    if (!reason) reason = r.headers.get('x-error-reason') || '';
    showPhotoError(i, r.status, reason);
  } catch (e) {
    showPhotoError(i, 0, e.name === 'AbortError' ? 'Timeout connessione' : e.message);
  }
}
function onPhotoError(i, img) {
  var isProxy = img && img.getAttribute('data-proxy') === '1';
  var pid = img && img.getAttribute('data-pid');
  if (isProxy && pid) diagnoseFetch(i, pid);
  else showPhotoError(i, 0, 'Immagine non raggiungibile');
}
function startPhotoTimeouts(posts) {
  for (var i = 0; i < posts.length; i++) {
    (function(idx, p) {
      if (!p.photo_url) return;
      var isProxy = p.photo_url.indexOf('/api/lookup?type=rphoto') === 0;
      var pid = p.id;
      setTimeout(function() {
        var pl = document.getElementById('pl' + idx);
        if (!pl || pl.style.display === 'none' || pl.classList.contains('photo-error')) return;
        if (isProxy) diagnoseFetch(idx, pid);
        else showPhotoError(idx, 0, 'Timeout caricamento immagine');
      }, 25000);
    })(i, posts[i]);
  }
}

// --- Testo espandibile ---
function initExpandButtons(posts) {
  for (var i = 0; i < posts.length; i++) {
    (function(idx) {
      var wrap = document.getElementById('ctw' + idx);
      var btn = document.getElementById('eb' + idx);
      if (!wrap || !btn) return;
      // Controlla se il contenuto supera l'altezza troncata
      if (wrap.scrollHeight > wrap.clientHeight + 2) {
        btn.style.display = 'block';
      }
    })(i);
  }
}
function expandText(i) {
  var wrap = document.getElementById('ctw' + i);
  var btn = document.getElementById('eb' + i);
  if (!wrap) return;
  wrap.classList.add('expanded');
  if (btn) btn.style.display = 'none';
}

// --- Rimozione annuncio ---
async function removePost(idx, postId, submitterTgId) {
  var btn = document.getElementById('rb' + idx);

  if (_tgApp && _tgApp.initData) {
    // Contesto Mini App: chiedi conferma via Telegram UI, poi chiama API
    _tgApp.showConfirm('Rimuovere questo annuncio?', async function(confirmed) {
      if (!confirmed) return;
      if (btn) btn.classList.add('removing');
      try {
        var r = await fetch('/api/lookup?type=recruit-remove&pid=' + postId, {
          method: 'POST',
          headers: { 'Authorization': 'tma ' + _tgApp.initData },
        });
        var j = await r.json().catch(function() { return {}; });
        if (r.ok) {
          var card = document.getElementById('card' + idx);
          if (card) {
            card.style.transition = 'opacity .3s';
            card.style.opacity = '0';
            setTimeout(function() { if (card.parentNode) card.parentNode.removeChild(card); }, 300);
          }
        } else {
          if (btn) btn.classList.remove('removing');
          _tgApp.showAlert(j.error || 'Errore rimozione.');
        }
      } catch (e) {
        if (btn) btn.classList.remove('removing');
        _tgApp.showAlert('Errore: ' + e.message);
      }
    });
  } else {
    // Contesto browser: apri bot via deep link
    var botUsername = _recruitMeta.bot_username;
    if (botUsername) {
      var confirmed = window.confirm('Per rimuovere l\'annuncio verrai reindirizzato al bot Telegram.\n\nProcedere?');
      if (!confirmed) return;
      window.open('https://t.me/' + botUsername + '?start=withdraw_' + postId, '_blank');
    } else {
      window.alert('Per rimuovere l\'annuncio, apri il bot Telegram \u2192 Community \u2192 Reclutamento \u2192 Annunci attivi.');
    }
  }
}

var timer = null, nextAt = null;
function schedule() {
  clearInterval(timer);
  nextAt = Date.now() + 60000;
  timer = setInterval(function() {
    var left = Math.max(0, Math.ceil((nextAt - Date.now()) / 1000));
    var hint = document.getElementById('hint');
    if (hint) hint.textContent = left > 0 ? 'Aggiornamento automatico tra ' + left + 's' : '';
    if (left === 0) load(false);
  }, 1000);
}

async function load(manual) {
  var dot = document.getElementById('dot');
  var st  = document.getElementById('statusText');
  var ct  = document.getElementById('content');
  if (manual) { dot.className = 'dot'; st.textContent = 'Aggiornamento\u2026'; }
  try {
    var res = await fetch('/api/lookup?type=recruit-list', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var json = await res.json();
    var posts = json.posts || [];
    _recruitMeta.bot_username = json.bot_username || null;
    _recruitMeta.owner_ids = json.owner_ids || [];
    var n = posts.length;
    dot.className = 'dot live';
    st.textContent = n ? n + (n === 1 ? ' annuncio attivo' : ' annunci attivi') : 'Nessun annuncio attivo';
    ct.innerHTML = renderCards(posts);
    // Dopo il rendering controlla troncamento e timeout foto
    requestAnimationFrame(function() {
      initExpandButtons(posts);
    });
    startPhotoTimeouts(posts);
    schedule();
  } catch (err) {
    dot.className = 'dot';
    st.textContent = 'Errore di rete';
    ct.innerHTML = '<div class="state-msg"><div class="icon">&#9888;&#65039;</div>' +
      '<p>Impossibile caricare gli annunci.<br><small>' + err.message + '</small></p></div>';
  }
}

load(true);
</script>
</body>
</html>
