<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fear United – CWL Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
    <div class="login-box">
        <h1>Fear United</h1>
        <p class="login-sub">CWL Manager</p>
        <div id="login-error" class="error-msg" style="display:none"></div>

        <form id="login-form">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Accedi</button>
        </form>
        <button id="show-signup" class="link-btn">Non hai un account? Registrati</button>

        <form id="signup-form" style="display:none">
            <input type="email" id="signup-email" placeholder="Email" required>
            <input type="password" id="signup-password" placeholder="Password (min 6 caratteri)" required>
            <button type="submit">Crea Account</button>
        </form>
        <button id="show-login" class="link-btn" style="display:none">Hai già un account? Accedi</button>
    </div>
</div>

<!-- APP (visibile dopo login) -->
<div id="app" style="display:none">
    <header>
        <div>
            <h1>Fear United – CWL Manager</h1>
        </div>
        <div class="user-bar">
            <span id="user-email"></span>
            <span id="user-role-badge" class="badge" style="display:none">Admin</span>
            <button id="logout-btn">Esci</button>
        </div>
    </header>

    <nav class="tabs">
        <button class="tab-btn active" data-tab="members">Membri</button>
        <button class="tab-btn" data-tab="cwl">CWL Bonus</button>
        <button class="tab-btn admin-only" data-tab="admin" style="display:none">Gestione Utenti</button>
    </nav>

    <main>
        <!-- TAB: MEMBRI -->
        <section id="tab-members" class="tab-content">
            <div class="section-header">
                <h2>Tabella Membri</h2>
                <button id="sync-btn">Sincronizza da CoC</button>
            </div>
            <div id="sync-status"></div>
            <div class="table-wrap">
            <table id="members-table">
                <thead>
                    <tr>
                        <th>TH</th>
                        <th>Nome / Tag</th>
                        <th>Ruolo</th>
                        <th>Trofei</th>
                        <th>Don. / Ric.</th>
                        <th>#</th>
                        <th>Dal</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            </div>
        </section>

        <!-- TAB: CWL BONUS -->
        <section id="tab-cwl" class="tab-content" style="display:none">
            <div class="section-header">
                <h2>Pannello CWL</h2>
                <div style="display:flex;gap:0.5rem">
                    <button id="load-cwl-history">Storico Marzo</button>
                    <button id="fetch-cwl-live">Aggiorna da API CoC</button>
                </div>
            </div>
            <div id="cwl-status"></div>
            <div id="bonus-results"></div>

            <!-- PANNELLO ASSEGNAZIONE BONUS (solo admin) -->
            <div id="bonus-panel" class="admin-only" style="display:none; margin-top:2rem">
                <div class="section-header">
                    <h2>Assegna Bonus Extra</h2>
                    <div class="bonus-controls">
                        <label>Stagione: <input id="bonus-season" type="month"></label>
                        <label>Bonus disponibili: <input id="bonus-count" type="number" min="1" max="8" value="6" class="bonus-count-input"></label>
                        <button id="generate-bonus">Auto-genera</button>
                        <button id="save-bonus" class="btn-save-bonus" style="display:none">Salva Assegnazione</button>
                    </div>
                </div>
                <div id="bonus-msg" class="bonus-msg-bar"></div>
                <div id="bonus-player-list"></div>
            </div>
        </section>

        <!-- TAB: ADMIN -->
        <section id="tab-admin" class="tab-content" style="display:none">
            <div class="section-header">
                <h2>Gestione Utenti</h2>
                <button id="refresh-users">Aggiorna</button>
            </div>
            <div id="admin-msg" class="info-msg" style="display:none"></div>
            <div class="table-wrap">
            <table id="users-table">
                <thead>
                    <tr>
                        <th>Email</th>
                        <th>Ruolo App</th>
                        <th>Registrato il</th>
                        <th>Azioni</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            </div>
        </section>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
